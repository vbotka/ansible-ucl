---
- name: VAL-1
  tags: ex-val-1
  block:
    - ucl:
        path: /etc/ssh/sshd_config
        owner: root
        group: wheel
        mode: '0644'
        upath: X11Forwarding
        value: 'no'
        lang: json
        validate: 'sshd -t -f %s'
      register: result
    - ansible.builtin.debug:
        msg: "{{ msg.splitlines() }}"
      vars:
        msg: |-
          {{ result | to_nice_yaml }}
      when: debug | d(false) | bool

# shell> ansible-playbook run_tests.yml -t ex-val-2 -e debug=true
# message: Content changed. Validated. Temporary file moved to path.

- name: VAL-2
  tags: ex-val-2
  block:
    - ucl:
        path: /etc/pkg/FreeBSD.conf
        owner: root
        group: wheel
        mode: '0644'
        upath: freebsd.enabled
        value: 'false'
        validate: 'pkg -C %s stat'
      register: result
    - ansible.builtin.debug:
        msg: "{{ msg.splitlines() }}"
      vars:
        msg: |-
          {{ result | to_nice_yaml }}
      when: debug | d(false) | bool

- name: VAL-3
  tags: ex-val-3
  block:
    - ucl:
        path: /etc/pkg/FreeBSD.conf
        owner: root
        group: wheel
        mode: '0644'
        upath: freebsd.enabled
        value: 'true'
        validate: 'pkg -C %s stat'
      register: result
    - ansible.builtin.debug:
        msg: "{{ msg.splitlines() }}"
      vars:
        msg: |-
          {{ result | to_nice_yaml }}
      when: debug | d(false) | bool

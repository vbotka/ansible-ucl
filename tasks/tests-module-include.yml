---

- name: INC-APP-HIGH
  tags: test-inc-app-high
  block:
    - ucl:
        path: "{{ tests_dir }}/include-append-high.in"
        chdir: /scratch/uclcmd
      register: result
    - ansible.builtin.debug:
        msg: "{{ msg.splitlines() }}"
      vars:
        msg: |-
          {{ result | to_nice_yaml }}

- name: INC-APP-LOW
  tags: test-inc-app-low

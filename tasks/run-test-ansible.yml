---

  # Create dictionary that will control the tests

- ansible.builtin.set_fact:
    _tests: {}

- name: Create dictionary _tests
  vars:
    _test_key: "{{ item.1 }}"
    _test_val: "{{ dict(['in', 'mod', 'res'] | zip([_in, _mod, _res])) }}"
    _in: "{{ tests_dir }}/{{ item.0.key }}"
    _mod: "{{ lookup('template', tests_dir_local ~ '/' ~ item.1) | from_yaml }}"
    _res: "{{ tests_dir_local }}/{{ item.1 | splitext | first }}.res"
  ansible.builtin.set_fact:
    _tests: "{{ _tests | combine({_test_key: _test_val}) }}"
  loop: "{{ tests_files | dict2items | subelements('value') }}"

- name: Debug2 tests
  when: debug2 | d(false) | bool
  ansible.builtin.debug:
    var: _tests

  # Run the tests and optionally display the results

- name: Run
  block:

    - name: Run module ucl
      ucl:
        executable: "{{ uclcmd }}"
        path: "{{ item.value.in }}"
        backup: "{{ item.value.mod.ucl.backup | d(omit) }}"
        chdir: "{{ item.value.mod.ucl.chdir | d(omit) }}"
        create: "{{ item.value.mod.ucl.create | d(omit) }}"
        delimiter: "{{ item.value.mod.ucl.delimiter | d(omit) }}"
        icontent: "{{ item.value.mod.ucl.icontent | d(omit) }}"
        ipath: "{{ item.value.mod.ucl.ipath | d(omit) }}"
        lang: "{{ item.value.mod.ucl.lang | d(omit) }}"
        merge: "{{ item.value.mod.ucl.merge | d(omit) }}"
        state: "{{ item.value.mod.ucl.state | d(omit) }}"
        upath: "{{ item.value.mod.ucl.upath | d(omit) }}"
        validate: "{{ item.value.mod.ucl.validate | d(omit) }}"
        value: "{{ item.value.mod.ucl.value | d(omit) }}"
        vtype: "{{ item.value.mod.ucl.vtype | d(omit) }}"
      register: tests_res
      loop: "{{ _tests | dict2items }}"
      loop_control:
        label: "{{ item.key }}"

  rescue:

    - name: Debug2 tests failed.
      ansible.builtin.debug:
        msg: "[ERR] Some of the tests failed. See debug2,3 for details."

    - name: Debug2 result.
      when: debug2 | d(false) | bool
      ansible.builtin.debug:
        msg: "{{ ansible_failed_result }}"

- name: Debug3 tests_res
  when: debug3 | d(false) | bool
  ansible.builtin.debug:
    var: tests_res

- name: Debug5 tests_res results
  when: debug5 | d(false) | bool
  vars:
    res: "{{ lookup('file', item.item.value.res) | string }}"
    msg: |-
      {{ item.stdout | type_debug }}
      {{ item.stdout | trim }}
      {{ res | type_debug }}
      {{ res | trim }}
  ansible.builtin.debug:
    msg: "{{ msg.split('\\n') }}"
  loop: "{{ tests_res.results }}"
  loop_control:
    label: "{{ item.item.key }}"

  # Compare results

- name: Diff results # noqa: command-instead-of-shell
  vars:
    _empty: ""
    res: "{{ lookup('file', item.item.value.res) | string }}"
    _cmd_diff: 'diff -B <(echo "{{ item.stdout | d(_empty) }}") <(echo "{{ res }}")'
    _cmd_fail: '/usr/bin/false'
    _cmd: "{{ item.failed | ternary(_cmd_fail, _cmd_diff) }}"
  check_mode: false
  changed_when: false
  ignore_errors: true
  register: tests_diff
  delegate_to: localhost
  ansible.builtin.shell:
    cmd: "bash -c '{{ _cmd }}'"
  loop: "{{ tests_res.results }}"
  loop_control:
    label: "{{ item.item.key }}"
